<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Hoja de styles Local -->
    <!-- <link rel="stylesheet" href="./Css/styles.css" /> -->
  </head>
  <body>
    <!-- Login -->
    <!-- ------------------------------------------------------------ -->
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card">
            <div class="card-body p-lg-3">
              <div class="text-center">
                <img src="#" alt="logo" />
                <h2>RestorApp</h2>
                <p>Login to your account</p>
              </div>
              <form id="form">
                <div class="form-group mb-2">
                  <label class="form-label" for="">Full Name</label>
                  <input
                    type="text"
                    name="email"
                    id="fullName"
                    placeholder="e.g John Doe"
                    class="form-control"
                  />
                </div>
                <div class="form-group mb-2">
                  <label class="form-label" for="">Full Name</label>
                  <input
                    type="text"
                    name="email"
                    id="email"
                    placeholder="name@example.com"
                    class="form-control"
                  />
                </div>
                <div class="form-group mb-2">
                  <label class="form-label" for="roles">Full Name</label>
                  <select class="form-select" name="roles" id="rol">
                    <option value="user">User</option>
                  </select>
                </div>

                <button type="submit" class="btn btn-success mt-5 w-100">
                  Sign In
                </button>
                <p class="text-center m-3"">Don´t have an account?<a href="">Sign up</a></p>
              </form>
              <!-- Mensajes informativos -->
              <div class="text-center msg">
                <!-- Status de login -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
