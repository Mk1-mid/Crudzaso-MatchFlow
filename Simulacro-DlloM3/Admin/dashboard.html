<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Nabar -->
    <nav>
      <div class="p-3 bg-info">navbar</div>
    </nav>

    <!-- Hero Metricas -->
    <header>
      <div class="row m-3">
        <div class="col-md-4">
          <div class="card">
            <h6>Total Orders</h6>
            <div class="div"># Data</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card">
            <h6>Total Orders</h6>
            <div class="div"># Data</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card">
            <h6>Total Orders</h6>
            <div class="div"># Data</div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main -->
    <main>
      <div class="row m-3">
        <!-- Lado Derecho Tablas -->
        <div class="col-md-8">
          <div class="container mt-5">
            <!-- Título del panel -->
            <h2 class="mb-4">Panel de Productos</h2>

            <!-- Botón para agregar producto -->
            <!-- <div class="mb-3 text-end">
              <button
                class="btn btn-success"
                data-bs-toggle="modal"
                data-bs-target="#productModal"
                onclick="openModal()"
              >
                Agregar Producto
              </button>
            </div> -->

            <!-- Tabla de productos -->
            <table class="table table-bordered table-striped">
              <thead class="table-dark">
                <tr>
                  <th>Id</th>
                  <th>User</th>
                  <th>Data</th>
                  <th>Status</th>
                  <th>Total</th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <!-- aqui va la data de las tablas-->
              </tbody>
            </table>
          </div>
        </div>
        <!-- Lado Izquierdo Aside -->
        <div class="col-md-4">
          <div class="container mt-5">
            <div class="card">
              <!-- Card Header -->
              <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                  <p class="">ORDER DETAILS</p>
                  <p class="btn bg-success">status</p>
                </div>
                <h6 id="idOrder">#</h6>
              </div>
              <!-- Card body -->
              <div class="card-body"></div>

              <!-- Card Footer -->

              <div class="card-footer">
                <p>UPDATE STATUS</p>
                <div class="d-flex justify-content-between">
                  <select name="status" id="updateStatus">
                    <option value="preparing">Preparing</option>
                    <option value="p">Pending</option>
                    <option value="delivered">Delivered</option>
                    <option value="ready">Ready</option>
                  </select>
                  <button class="btn btn-success">Update</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="./admin.js"></script>
  </body>
</html>
